
/* This is the default protobuf file for the general structure of the data. It does not compile by it alone but needs
   to be extended by specific methods. See for example the template/template.proto

   Properties can be extended by the user to define the properties of the detected features. For example properties of
   features might include their size, intensity, orientation, or more complex self-computed heuristics.
 */

message VoxelData {
  repeated float coordinate = 1;
  optional float value = 2;
}
message VoxelRepresentation {
  optional string desc = 1;
  repeated string dims = 2;
  repeated VoxelData voxel_data = 3;
}

/*
message VertexData {
  repeated float position = 1;
  optional float value = 2;
}
message FaceData {
  repeated uint32 vertices = 1; // reference to vertex_list
  optional float value = 2;
}
